services:
  - type: web
    name: nexqa-hooks
    runtime: docker
    dockerfilePath: ./webhook_server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: RETELL_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CALCOM_API_KEY
        sync: false
      - key: AIRTABLE_API_KEY
        sync: false
      - key: AIRTABLE_REGISTRY_BASE_ID
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
