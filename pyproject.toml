[project]
name = "nexqa"
version = "0.3.0"
description = "Open-source QA and prompt evolution for voice AI agents (Retell, Vapi, ElevenLabs, Bland, Synthflow, Ultravox, LiveKit, Pipecat)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nick Lopez"}]
requires-python = ">=3.11"
keywords = ["voice-ai", "voice-agents", "qa", "testing", "prompt-optimization", "llm", "retell", "vapi", "elevenlabs", "bland", "synthflow", "ultravox", "livekit", "pipecat", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=2.8",
    "typer>=0.9",
    "rich>=13.0",
    "requests>=2.31",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-docx>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
# REST API that stores runs in MongoDB (nexqa/api)
api = ["motor>=3.3", "dnspython>=2.4"]
# Streamlit dashboard (nexqa/dashboard)
dashboard = ["streamlit>=1.32", "plotly>=5.19", "pandas>=2.2"]
# Tool-call webhook server (webhook_server/)
webhook = ["pydantic-settings>=2.1", "aiohttp>=3.9", "tzdata"]
# Ultravox text-only test calls (WebSocket client)
ultravox = ["websockets>=13"]
all = ["nexqa[api,dashboard,webhook,ultravox]"]
dev = ["nexqa[all]", "pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/NicxOp1/nexqa-oss"
Issues = "https://github.com/NicxOp1/nexqa-oss/issues"

[project.scripts]
nexqa = "nexqa.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexqa", "webhook_server"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
filterwarnings = ["ignore:cannot collect test class 'TestStepType':pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Real bugs only (syntax errors, undefined names, unused code). Style is up to you.
select = ["E9", "F"]
